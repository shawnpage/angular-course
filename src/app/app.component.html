<div class="top-menu">

    <img class="logo" alt="logo"
         src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">

</div>

<div class="courses">

  <!-- @for (course of courses; track trackCourse; -->

<!--
  @for (course of courses; track trackCourse;
    let index = $index;
    let last = $last;
    let even = $even;
    ) {
-->

    <course-card *ngFor="let course of courses;
                 index as i;
                 first as isFirst;
                 last as isLast;
                 even as isEven; odd as isOdd;"
                 [class.is-first]="isFirst"
                 [class.is-last]="isLast"
                 [class.is-even]="isEven"
                 [class.is-odd]="isOdd"
                 (courseSelected) = "onCourseSelected($event)"
                 [course]="course" [index]="i+1" [cardIndex]=""></course-card>

<!--
      [index]="index"
      [class.is-first] = $first
      [class.is-last] = last
      [class.is-even] = "even"
      [class.is-odd] = $odd
      (courseSelected)="onCourseSelected($event)"/>
  }
  @empty {
    <h1>No courses found!</h1>
  }
-->

</div>
